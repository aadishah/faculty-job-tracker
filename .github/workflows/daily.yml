name: Daily check

on:
  schedule:
    - cron: "30 2 * * *" # 8:00 am India time, every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tracker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python tracker.py
      - name: Save results
        if: always()
        run: |
          git config user.name "job-tracker"
          git config user.email "job-tracker@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update openings"
          git push
